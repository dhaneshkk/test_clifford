[package]
name = "vg360-pipeline"
description = "VisionGuard360 per-camera worker: camera guard + detection + scene + rules, with shift compensation"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version = "1.98"

[features]
default = ["tract"]
tract = ["vg360-infer/tract"]
ort = ["vg360-infer/ort"]

[dependencies]
serde.workspace = true
vg360-geom = { path = "../vg360-geom" }
vg360-vision = { path = "../vg360-vision" }
vg360-guard = { path = "../vg360-guard" }
vg360-infer = { path = "../vg360-infer", default-features = false }
vg360-scene = { path = "../vg360-scene" }
vg360-rules = { path = "../vg360-rules" }
vg360-evidence = { path = "../vg360-evidence" }
serde_json.workspace = true

[dev-dependencies]
serde_json.workspace = true
