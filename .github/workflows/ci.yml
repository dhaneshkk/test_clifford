name: ci
on: [push, pull_request]
jobs:
  core:
    name: geometry · vision · guard (no OpenCV)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: cargo test --release -p vg360-geom -p vg360-vision -p vg360-guard
  server:
    name: console (Topcoat, Rust ≥ 1.99)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: cargo build --release -p vg360-server
