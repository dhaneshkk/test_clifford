name: ci
on: [push, pull_request]
jobs:
  core:
    name: geometry · vision · guard · inference · scene · pipeline · rules (pure Rust)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: sudo apt-get update -q && sudo apt-get install -yq ffmpeg
      - run: ./scripts/fetch_models.sh
      - run: cargo test --release -p vg360-geom -p vg360-vision -p vg360-guard -p vg360-infer -p vg360-scene -p vg360-pipeline -p vg360-rules -p vg360-evidence
  onnxruntime:
    name: inference on ONNX Runtime (load-dynamic)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - uses: actions/setup-python@v6
        with: { python-version: "3.12" }
      - run: pip install onnxruntime
      - run: ./scripts/fetch_models.sh
      - run: |
          export ORT_DYLIB_PATH=$(python -c "import onnxruntime,glob,os;print(glob.glob(os.path.join(os.path.dirname(onnxruntime.__file__),'capi','libonnxruntime.so*'))[0])")
          cargo test --release -p vg360-infer --features ort -- --nocapture
  server:
    name: console (Topcoat, Rust ≥ 1.99)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: cargo build --release -p vg360-server
  provenance:
    name: evidence end to end (vesdb + witness + vesdb-verify)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/checkout@v5
        with: { repository: dhaneshkk/test1_vesdb, path: vesdb }
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with: { workspaces: ". -> target\nvesdb -> target" }
      - run: cargo build --release --manifest-path vesdb/Cargo.toml -p vesdb-server -p vesdb-witness -p vesdb-verify
      - run: VESDB_BIN_DIR=$PWD/vesdb/target/release cargo test --release -p vg360-evidence -- --nocapture
