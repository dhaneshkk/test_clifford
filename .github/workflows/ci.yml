name: ci
on: [push, pull_request]
jobs:
  core:
    name: geometry · vision · guard · inference · scene · pipeline · rules (pure Rust)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: sudo apt-get update -q && sudo apt-get install -yq ffmpeg
      - run: ./scripts/fetch_models.sh
      - run: cargo test --release -p vg360-geom -p vg360-vision -p vg360-guard -p vg360-infer -p vg360-scene -p vg360-pipeline -p vg360-rules -p vg360-evidence
  onnxruntime:
    name: inference on ONNX Runtime (load-dynamic)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - uses: actions/setup-python@v6
        with: { python-version: "3.12" }
      - run: pip install onnxruntime
      - run: ./scripts/fetch_models.sh
      - run: |
          export ORT_DYLIB_PATH=$(python -c "import onnxruntime,glob,os;print(glob.glob(os.path.join(os.path.dirname(onnxruntime.__file__),'capi','libonnxruntime.so*'))[0])")
          cargo test --release -p vg360-infer --features ort -- --nocapture
  server:
    name: console (Topcoat, Rust ≥ 1.99) + live demo end to end
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: sudo apt-get update -q && sudo apt-get install -yq ffmpeg
      - run: ./scripts/fetch_models.sh
      - run: cargo build --release -p vg360-server
      # VG360_DEMO=1 console: live worker, SSE, snapshots, signals, streaming /v1/chat/completions
      - run: cargo test --release -p vg360-server -- --nocapture
  provenance:
    name: evidence end to end (vesdb + witness + vesdb-verify)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/checkout@v5
        with: { repository: dhaneshkk/test1_vesdb, path: vesdb }
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with: { workspaces: ". -> target\nvesdb -> target" }
      - run: cargo build --release --manifest-path vesdb/Cargo.toml -p vesdb-server -p vesdb-witness -p vesdb-verify
      - run: VESDB_BIN_DIR=$PWD/vesdb/target/release cargo test --release -p vg360-evidence -- --nocapture
  lean:
    name: Lean proofs (lean/ · Mathlib · no sorry)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - run: "! grep -rnw --include='*.lean' -e sorry -e admit lean/VG360 lean/VG360.lean"
      - uses: leanprover/lean-action@v1
        with:
          lake-package-directory: lean
  notebook:
    name: training notebook (single cell, VG360_FAST=1 smoke run)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with: { python-version: "3.12" }
      - run: pip install torch --index-url https://download.pytorch.org/whl/cpu
      - run: pip install onnx onnxruntime opencv-python-headless scikit-learn nbformat
      - name: notebook is one valid nbformat cell
        run: python -c "import nbformat as n; nb=n.read('notebooks/vg360_train_cpu.ipynb',4); n.validate(nb); assert len(nb.cells)==1 and nb.cells[0].cell_type=='code'"
      - name: smoke run (Clifford + CNN with SAM, fold, ONNX parity, card, golden)
        run: |
          python -c "import nbformat as n; open('/tmp/cell.py','w').write(n.read('notebooks/vg360_train_cpu.ipynb',4).cells[0].source)"
          VG360_FAST=1 VG360_OUT=/tmp/vg360_out python /tmp/cell.py
          python -c "import json; c=json.load(open('/tmp/vg360_out/models/ppe_clifford_folded.card.json')); assert c['parity']['max_abs_torch_vs_onnxruntime'] < 1e-3; print(c['metrics']['test_mcc'])"
